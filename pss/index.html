<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PSS</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--bd:#ccc;--ac:#2a6;--rd:#c33;--hv:#f2f2f2}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#ddd;--mut:#999;--bd:#333;--ac:#4c8;--rd:#e66;--hv:#1f1f1f}}
body{margin:0 auto;max-width:1100px;padding:12px;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
.top{display:flex;gap:6px;margin-bottom:8px}
#q{flex:1;min-width:0;padding:8px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
button{font:inherit;padding:4px 10px;cursor:pointer;background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
button:active,button.ok{background:var(--ac);color:#fff}
#s{font-size:12px;color:var(--mut);min-height:16px;margin-bottom:6px}
.sec{margin-top:14px;padding-top:10px;border-top:1px solid var(--bd)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
.sh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.c{position:relative;border:1px solid var(--bd);padding:8px 10px;min-height:88px;cursor:pointer;user-select:none}
.c:hover{background:var(--hv)}
.c.ok{background:var(--ac);color:#fff}
.c b{display:block;padding-right:52px;font-weight:600}
.pv{font-size:12px;color:var(--mut);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c.ok .pv{color:#fff}
.mm{position:absolute;top:6px;right:6px;padding:2px 8px;font-size:12px}
.eb{display:flex;gap:4px;justify-content:flex-end;margin-top:6px;opacity:0}
.c:hover .eb{opacity:1}
.eb button{padding:1px 7px;font-size:12px}
.x{color:var(--rd)}
[hidden]{display:none!important}
#g{max-width:280px;margin:20vh auto 0;display:flex;flex-direction:column;gap:8px}
#g input{padding:8px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
#gm{font-size:12px;color:var(--rd);word-break:break-all;min-height:16px}
dialog{width:min(560px,92vw);background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog input,dialog textarea{display:block;width:100%;box-sizing:border-box;margin:2px 0 8px;padding:6px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
dialog textarea{height:150px}
dialog label{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div id="g"><input id="gp" type="password" placeholder="Password" autocomplete="off"><button id="gb">OK</button><div id="gm"></div></div>
<div id="app" hidden>
<div class="top">
<input id="q" placeholder="Search ( / )" autocomplete="off">
<button id="n" style="display:none">+ New</button>
<button id="k" title="Token">🔑</button>
</div>
<div id="s"></div>
<div id="l"></div>
<dialog id="d">
<label>Title</label><input id="dt">
<label>Template</label><textarea id="dc"></textarea>
<label>Memo</label><textarea id="dm" style="height:80px"></textarea>
<div style="text-align:right"><button id="dx">Cancel</button> <button id="ds">Save</button></div>
</dialog>
</div>
<script>
// ===== CONFIG =====
const OWNER='phillipeque', REPO='portfolio', PATH='pss/templates.json';
// Cole aqui o hash gerado pela tela de senha (deixe vazio na primeira vez)
const HASH='1201';
// ==================
const API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+PATH;
const $=id=>document.getElementById(id);
let lastL=0,busy=false,T=[],sha=null,tok=localStorage.getItem('pss_tk')||'',ei=-1;
try{T=JSON.parse(localStorage.getItem('pss_c')||'[]')}catch(e){}

const enc=s=>btoa(unescape(encodeURIComponent(s)));
const dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const msg=(t,err)=>{$('s').textContent=t;$('s').style.color=err?'var(--rd)':''};
const hd=()=>{const h={Accept:'application/vnd.github+json'};if(tok)h.Authorization='Bearer '+tok;return h};

async function load(){
  lastL=Date.now();
  try{
    const r=await fetch(API+'?t='+Date.now(),{headers:hd(),cache:'no-store'});
    if(r.status===404){sha=null;msg('No templates file yet. Add one to create it.');return}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();sha=j.sha;T=JSON.parse(dec(j.content));
    localStorage.setItem('pss_c',JSON.stringify(T));render();msg('');
  }catch(e){msg('Offline or API error. Showing local copy.',1)}
}
async function save(note){
  if(!tok){msg('Set your token first (🔑).',1);return false}
  msg('Saving...');
  try{
    const b={message:note,content:enc(JSON.stringify(T,null,1))};if(sha)b.sha=sha;
    const r=await fetch(API,{method:'PUT',headers:hd(),body:JSON.stringify(b)});
    if(r.status===409||r.status===422){msg('Conflict: changed elsewhere. Reloading, redo your edit.',1);await load();return false}
    if(!r.ok)throw new Error(r.status);
    sha=(await r.json()).content.sha;localStorage.setItem('pss_c',JSON.stringify(T));msg('Saved.');return true
  }catch(e){msg('Save failed ('+e.message+'). Check token.',1);await load();return false}
}

function cp(s,el){
  const done=()=>{el.classList.add('ok');setTimeout(()=>el.classList.remove('ok'),700)};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(done,()=>fb(s,done));else fb(s,done)
}
function fb(s,d){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();d()}
function eb(t,fn,c){const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=e=>{e.stopPropagation();fn()};return b}

const CATS=[['memo','Memos'],['template','Templates'],['both','Both']];
const cat=x=>x.c&&x.m?'both':x.c?'template':'memo';
function card(x,i){
  const main=x.c||x.m;
  const d=document.createElement('div');d.className='c';
  d.dataset.s=(x.t+' '+x.c+' '+x.m).toLowerCase();
  d.onclick=()=>cp(main,d);
  const b=document.createElement('b');b.textContent=x.t;
  const pv=document.createElement('div');pv.className='pv';pv.textContent=main;
  d.append(b,pv);
  if(x.c&&x.m){
    const m=document.createElement('button');m.textContent='Memo';m.className='mm';
    m.onclick=e=>{e.stopPropagation();cp(x.m,m)};d.append(m)
  }
  if(tok){
    const bar=document.createElement('div');bar.className='eb';
    bar.append(eb('◀',()=>mv(i,-1)),eb('▶',()=>mv(i,1)),eb('Edit',()=>openD(i)),eb('Del',async()=>{
      if(!confirm('Delete "'+x.t+'"?'))return;
      const bk=T.slice();T.splice(i,1);
      if(!(await save('Delete: '+x.t)))T=bk;
      render()
    },'x'));
    d.append(bar)
  }
  return d
}
function render(){
  const l=$('l');l.textContent='';
  CATS.forEach(([k,label])=>{
    const items=T.map((x,i)=>[x,i]).filter(([x])=>cat(x)===k);
    if(!items.length)return;
    const sec=document.createElement('div');sec.className='sec';
    const h=document.createElement('div');h.className='sh';h.textContent=label;
    const g=document.createElement('div');g.className='g';
    items.forEach(([x,i])=>g.appendChild(card(x,i)));
    sec.append(h,g);l.appendChild(sec)
  });
  $('n').style.display=tok?'':'none';filt()
}
function filt(){
  const v=$('q').value.toLowerCase();
  for(const sec of $('l').children){
    let n=0;
    for(const d of sec.lastChild.children){const ok=d.dataset.s.includes(v);d.style.display=ok?'':'none';if(ok)n++}
    sec.style.display=n?'':'none'
  }
}

async function mv(i,d){
  let j=i+d;while(j>=0&&j<T.length&&cat(T[j])!==cat(T[i]))j+=d;
  if(busy||j<0||j>=T.length)return;
  busy=true;const bk=T.slice();[T[i],T[j]]=[T[j],T[i]];render();
  if(!(await save('Reorder')))T=bk;
  busy=false;render()
}
function openD(i){ei=i;const x=i>=0?T[i]:{t:'',c:'',m:''};$('dt').value=x.t;$('dc').value=x.c;$('dm').value=x.m;$('d').showModal();$('dt').focus()}
$('n').onclick=()=>openD(-1);
$('dx').onclick=()=>$('d').close();
$('ds').onclick=async()=>{
  const x={t:$('dt').value.trim(),c:$('dc').value,m:$('dm').value};
  if(!x.t||(!x.c.trim()&&!x.m.trim())){alert('Title and at least one of Template or Memo are required.');return}
  const bk=T.slice();ei>=0?T[ei]=x:T.push(x);
  $('d').close();
  if(!(await save((ei>=0?'Edit: ':'Add: ')+x.t)))T=bk;
  render()
};
$('k').onclick=()=>{
  const v=prompt('GitHub token (empty = log out):',tok?'(saved)':'');
  if(v===null||v==='(saved)')return;
  tok=v.trim();tok?localStorage.setItem('pss_tk',tok):localStorage.removeItem('pss_tk');
  render();load()
};
$('q').oninput=filt;
addEventListener('keydown',e=>{
  if($('app').hidden||$('d').open)return;
  if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}
  else if(e.key==='Escape'){$('q').value='';filt();$('q').blur()}
});
function rf(){if(!$('app').hidden&&!document.hidden&&!busy&&!$('d').open&&Date.now()-lastL>20000)load()}
document.addEventListener('visibilitychange',rf);addEventListener('focus',rf);
const h256=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function start(){$('g').hidden=true;$('app').hidden=false;render();load()}
async function unlock(){
  const h=await h256($('gp').value);
  if(!HASH){$('gm').style.color='var(--fg)';$('gm').textContent='Cole isto em HASH no código: '+h;return}
  if(h===HASH){sessionStorage.setItem('pss_ok',HASH);start()}
  else{$('gm').style.color='var(--rd)';$('gm').textContent='Wrong password.';$('gp').select()}
}
$('gb').onclick=unlock;
$('gp').onkeydown=e=>{if(e.key==='Enter')unlock()};
if(HASH&&sessionStorage.getItem('pss_ok')===HASH)start();else $('gp').focus();
</script>
</body>
</html>
