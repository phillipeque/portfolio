<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PSS</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--bd:#ccc;--ac:#2a6;}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#ddd;--mut:#999;--bd:#333;--ac:#4c8;}}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
#q{width:100%;box-sizing:border-box;padding:8px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);margin-bottom:8px}
.i{border:1px solid var(--bd);margin-bottom:6px;padding:6px 8px}
.h{display:flex;gap:6px;align-items:center}
.h b{flex:1;font-weight:600}
button{font:inherit;padding:4px 10px;cursor:pointer;background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
button:active,button.ok{background:var(--ac);color:#fff}
details{margin-top:4px;color:var(--mut)}
summary{cursor:pointer;font-size:12px}
pre{white-space:pre-wrap;margin:4px 0 0;font:inherit;font-size:13px}
</style>
</head>
<body>
<input id="q" placeholder="Search ( / )" autocomplete="off">
<div id="l"></div>
<script>
// Para adicionar um template: copie um bloco {t,c,m} e cole na lista.
// Se o texto tiver crase (`), escreva como \`
const T=[
{t:`Can't upgrade specific item`,
c:`To resolve the upgrade issue, follow these steps:

1. Check all equipment presets and remove the specific item from any preset where it is equipped, not just your active one.
2. Make sure the item is in your inventory.
3. Reopen the Substance Morph menu (Alt + H) and try the upgrade again.

If the issue persists, double-check all presets.`,
m:`Issue: The user cannot upgrade a specific item.
Resolution: Provided the user with workarounds.`}
];

const l=document.getElementById('l'),q=document.getElementById('q');
function cp(s,b){
  const done=()=>{const o=b.textContent;b.textContent='Copied!';b.className='ok';setTimeout(()=>{b.textContent=o;b.className=''},900)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(done,()=>fb(s,done))}else fb(s,done);
}
function fb(s,d){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();d()}
function btn(txt,s){const b=document.createElement('button');b.textContent=txt;b.onclick=()=>cp(s,b);return b}
T.forEach(x=>{
  const d=document.createElement('div');d.className='i';d.dataset.s=(x.t+' '+x.c+' '+x.m).toLowerCase();
  const h=document.createElement('div');h.className='h';
  const b=document.createElement('b');b.textContent=x.t;
  h.append(b,btn('Template',x.c),btn('Memo',x.m));
  const e=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');
  s.textContent='preview';p.textContent=x.c+'\n\n— MEMO —\n'+x.m;e.append(s,p);
  d.append(h,e);l.appendChild(d);
});
q.oninput=()=>{const v=q.value.toLowerCase();for(const d of l.children)d.style.display=d.dataset.s.includes(v)?'':'none'};
addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
  else if(e.key==='Escape'){q.value='';q.oninput();q.blur()}
});
</script>
</body>
</html>
