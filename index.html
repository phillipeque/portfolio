<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Portfólio Retro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #tv-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* CONTEÚDO – fundo da TV */
        #tv-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e, #0a0a12);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            padding: 12% 18% 15% 18%;
        }

        /* ===== CARD CENTRAL (estilo AWGE) ===== */
        .awge-card {
            background: #2a2a2a;
            border-radius: 20px;
            width: 100%;
            max-width: 700px;
            padding: 0;
            box-shadow: 0 0 30px rgba(0,255,0,0.1), inset 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #3a3a3a;
            overflow: hidden;
        }

        /* BARRA SUPERIOR (cabeçalho do card) */
        .awge-card-header {
            background: #1a1a1a;
            padding: 1.2rem 2rem;
            border-bottom: 2px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .awge-card-header h1 {
            color: #0f0;
            font-size: 1.8rem;
            letter-spacing: 6px;
            font-weight: normal;
            text-shadow: 0 0 10px #0f0;
        }

        .awge-card-header .header-icons {
            display: flex;
            gap: 12px;
        }

        .awge-card-header .header-icons span {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #555;
        }

        .awge-card-header .header-icons span:nth-child(1) { background: #ff5f56; }
        .awge-card-header .header-icons span:nth-child(2) { background: #ffbd2e; }
        .awge-card-header .header-icons span:nth-child(3) { background: #27c93f; }

        /* CORPO DO CARD (itens do menu) */
        .awge-card-body {
            padding: 2rem 2.5rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem 2rem;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: default;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .menu-item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #111;
            border-radius: 6px;
            padding: 4px;
        }

        .menu-item span {
            color: #aaa;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        /* ÍTEM ATIVO */
        .menu-item.active {
            background: #1a1a1a;
            border-color: #0f0;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
        }

        .menu-item.active span {
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }

        .menu-item.active img {
            border-color: #0f0;
            box-shadow: 0 0 15px #0f0;
        }

        /* RODAPÉ DO CARD (instrução) */
        .awge-card-footer {
            background: #1a1a1a;
            padding: 0.8rem 2rem;
            border-top: 2px solid #3a3a3a;
            text-align: center;
            color: #555;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* FRAME DA TV */
        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('pngs/tvframe.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            pointer-events: none;
            z-index: 10;
        }

        /* SCANLINES (opcional) */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0) 3px,
                rgba(0,0,0,0.15) 3px,
                rgba(0,0,0,0.15) 4px
            );
            pointer-events: none;
            z-index: 20;
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .awge-card-body {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }
            .awge-card-header h1 {
                font-size: 1.4rem;
            }
            .menu-item span {
                font-size: 1rem;
            }
            #tv-screen {
                padding: 10% 12% 12% 12%;
            }
            .awge-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="tv-container">
        <div id="tv-screen">
            <!-- CARD CENTRAL -->
            <div class="awge-card">
                <!-- CABEÇALHO -->
                <div class="awge-card-header">
                    <h1>PORTFOLIO</h1>
                    <div class="header-icons">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>

                <!-- CORPO (MENU) -->
                <div class="awge-card-body" id="menu-body">
                    <div class="menu-item" data-target="sobre">
                        <img src="pngs/icone-sobre.png" alt="Sobre" />
                        <span>SOBRE</span>
                    </div>
                    <div class="menu-item" data-target="projetos">
                        <img src="pngs/icone-projetos.png" alt="Projetos" />
                        <span>PROJETOS</span>
                    </div>
                    <div class="menu-item" data-target="habilidades">
                        <img src="pngs/icone-habilidades.png" alt="Habilidades" />
                        <span>HABILIDADES</span>
                    </div>
                    <div class="menu-item" data-target="contato">
                        <img src="pngs/icone-contato.png" alt="Contato" />
                        <span>CONTATO</span>
                    </div>
                    <div class="menu-item" data-target="blog">
                        <img src="pngs/icone-blog.png" alt="Blog" />
                        <span>BLOG</span>
                    </div>
                    <div class="menu-item" data-target="depoimentos">
                        <img src="pngs/icone-depoimentos.png" alt="Depoimentos" />
                        <span>DEPOIMENTOS</span>
                    </div>
                </div>

                <!-- RODAPÉ -->
                <div class="awge-card-footer">← → ↑ ↓ · ENTER</div>
            </div>
        </div>

        <div id="tv-frame"></div>
        <!-- <div id="scanlines"></div> -->
    </div>

    <script>
        (function() {
            const items = document.querySelectorAll('.menu-item');
            const total = items.length;
            let current = 0;

            function updateMenu() {
                items.forEach((item, index) => {
                    item.classList.toggle('active', index === current);
                });
            }

            // Navegação por setas (grade 2 colunas)
            document.addEventListener('keydown', function(e) {
                const cols = 2;
                let row = Math.floor(current / cols);
                let col = current % cols;

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (col < cols - 1 && current + 1 < total) {
                        current++;
                    } else if (current + 1 < total) {
                        current++;
                    }
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (col > 0) {
                        current--;
                    } else if (current - 1 >= 0) {
                        current--;
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (current + cols < total) {
                        current += cols;
                    } else {
                        current = total - 1;
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (current - cols >= 0) {
                        current -= cols;
                    } else {
                        current = 0;
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const target = items[current].getAttribute('data-target');
                    alert('Navegando para: ' + target);
                }
                updateMenu();
            });

            // Clique e duplo clique
            items.forEach((item, index) => {
                item.addEventListener('click', function() {
                    current = index;
                    updateMenu();
                });
                item.addEventListener('dblclick', function() {
                    const target = item.getAttribute('data-target');
                    alert('Navegando para: ' + target);
                });
            });

            updateMenu();
        })();
    </script>
</body>
</html>
