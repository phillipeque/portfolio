<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Portfólio Retro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #tv-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* CONTEÚDO – centralizado com grade */
        #tv-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e, #0a0a12);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            z-index: 1;
            padding: 12% 18% 15% 18%;
            text-align: center;
        }

        /* TÍTULO "PORTFOLIO" */
        #tv-screen h1 {
            font-size: 3.5rem;
            letter-spacing: 6px;
            margin-bottom: 3rem;
            border-bottom: 2px solid #0f0;
            padding-bottom: 0.5rem;
            font-weight: normal;
        }

        /* GRADE DE ÍCONES */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem 4rem;
            max-width: 700px;
            width: 100%;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: default;
            transition: all 0.2s;
            padding: 0.5rem;
        }

        .icon-item img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #111;
            border-radius: 8px;
            padding: 8px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .icon-item span {
            margin-top: 0.6rem;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #0f0;
            text-shadow: 0 0 8px #0f0;
        }

        /* ÍTEM ATIVO (foco) */
        .icon-item.active img {
            border-color: #0f0;
            box-shadow: 0 0 25px #0f0;
            background: #0f0;
        }

        .icon-item.active span {
            color: #000;
            background: #0f0;
            padding: 0 8px;
            text-shadow: none;
        }

        /* SUBTEXTO (instrução) */
        .sub {
            margin-top: 3rem;
            font-size: 0.9rem;
            opacity: 0.5;
            letter-spacing: 2px;
        }

        /* FRAME */
        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('pngs/tvframe.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            pointer-events: none;
            z-index: 10;
        }

        /* SCANLINES (opcional) */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0) 3px,
                rgba(0,0,0,0.15) 3px,
                rgba(0,0,0,0.15) 4px
            );
            pointer-events: none;
            z-index: 20;
        }

        @media (max-width: 768px) {
            .icon-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem 1.5rem;
            }
            .icon-item img {
                width: 50px;
                height: 50px;
            }
            .icon-item span {
                font-size: 0.9rem;
            }
            #tv-screen h1 {
                font-size: 2.5rem;
                margin-bottom: 2rem;
            }
            #tv-screen {
                padding: 10% 12% 12% 12%;
            }
        }
    </style>
</head>
<body>
    <div id="tv-container">
        <div id="tv-screen">
            <!-- TÍTULO -->
            <h1>PORTFOLIO</h1>

            <!-- GRADE DE ÍCONES -->
            <div class="icon-grid" id="icon-grid">
                <div class="icon-item" data-target="sobre">
                    <img src="pngs/icone-sobre.png" alt="Sobre" />
                    <span>SOBRE</span>
                </div>
                <div class="icon-item" data-target="projetos">
                    <img src="pngs/icone-projetos.png" alt="Projetos" />
                    <span>PROJETOS</span>
                </div>
                <div class="icon-item" data-target="habilidades">
                    <img src="pngs/icone-habilidades.png" alt="Habilidades" />
                    <span>HABILIDADES</span>
                </div>
                <div class="icon-item" data-target="contato">
                    <img src="pngs/icone-contato.png" alt="Contato" />
                    <span>CONTATO</span>
                </div>
                <div class="icon-item" data-target="blog">
                    <img src="pngs/icone-blog.png" alt="Blog" />
                    <span>BLOG</span>
                </div>
                <div class="icon-item" data-target="depoimentos">
                    <img src="pngs/icone-depoimentos.png" alt="Depoimentos" />
                    <span>DEPOIMENTOS</span>
                </div>
            </div>

            <div class="sub">← → ↑ ↓ &nbsp;·&nbsp; ENTER</div>
        </div>

        <div id="tv-frame"></div>
        <!-- <div id="scanlines"></div> -->
    </div>

    <script>
        (function() {
            const items = document.querySelectorAll('.icon-item');
            const total = items.length;
            let current = 0;

            function updateMenu() {
                items.forEach((item, index) => {
                    item.classList.toggle('active', index === current);
                });
            }

            // Navegação por setas (grade 3 colunas)
            document.addEventListener('keydown', function(e) {
                const cols = 3;
                let row = Math.floor(current / cols);
                let col = current % cols;

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (col < cols - 1 && current + 1 < total) {
                        current++;
                    } else {
                        // vai para o próximo da linha, ou fica
                        if (current + 1 < total) current++;
                    }
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (col > 0) {
                        current--;
                    } else {
                        // vai para o final da linha anterior, ou fica
                        if (current - 1 >= 0) current--;
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (current + cols < total) {
                        current += cols;
                    } else {
                        // vai para o último disponível
                        current = total - 1;
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (current - cols >= 0) {
                        current -= cols;
                    } else {
                        current = 0;
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const target = items[current].getAttribute('data-target');
                    alert('Navegando para: ' + target);
                }
                updateMenu();
            });

            // Clique também ativa e duplo clique dispara ação
            items.forEach((item, index) => {
                item.addEventListener('click', function() {
                    current = index;
                    updateMenu();
                });
                item.addEventListener('dblclick', function() {
                    const target = item.getAttribute('data-target');
                    alert('Navegando para: ' + target);
                });
            });

            updateMenu();
        })();
    </script>
</body>
</html>
