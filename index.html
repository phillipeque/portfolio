<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Portfólio Retro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #tv-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* === FUNDO COM EFEITO STATIC (mantido) === */
        #tv-static {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0,0,0,0.15) 0px,
                    rgba(0,0,0,0.15) 1px,
                    transparent 1px,
                    transparent 2px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(0,0,0,0.15) 0px,
                    rgba(0,0,0,0.15) 1px,
                    transparent 1px,
                    transparent 2px
                );
            background-size: 100% 4px, 4px 100%;
            animation: staticMove 0.1s steps(2) infinite;
            z-index: 0;
        }

        @keyframes staticMove {
            0% { background-position: 0 0, 0 0; }
            50% { background-position: 0 2px, 2px 0; }
            100% { background-position: 0 4px, 4px 0; }
        }

        /* === CONTEÚDO – centralizado === */
        #tv-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            padding: 12% 18% 15% 18%;
            text-align: center;
        }

        /* === JANELA ESTILO AWGE (AGRORA OCUPA 100%) === */
        .retro-window {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: 
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #000000,
                4px 4px 0 rgba(0,0,0,0.3);
            width: 100%;
            max-width: 100%;          /* ← AGORA 100% DA LARGURA DISPONÍVEL */
            color: #000;
            text-shadow: none;
            position: relative;
        }

        .window-titlebar {
            background: linear-gradient(90deg, #808080, #a0a0a0);
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
        }

        /* ÍCONE DO TÍTULO REMOVIDO – agora só o texto */
        .window-title {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #000;
            text-shadow: 1px 1px 0 #a0a0a0;
            margin-left: 4px;
        }

        .window-content {
            padding: 20px;
            background: #c0c0c0;
        }

        /* === GRID DE ÍCONES (3 colunas, sem media) === */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 colunas */
            gap: 20px;
            margin-bottom: 10px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 10px 5px;
            transition: all 0.15s;
            border: 1px solid transparent;
        }

        .icon-item:hover {
            background: rgba(0,0,0,0.1);
            border: 1px dotted #000;
        }

        .icon-item.active {
            background: rgba(0,0,0,0.15);
            border: 1px dotted #000;
        }

        .icon-img {
            width: 64px;          /* um pouco maior */
            height: 64px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .icon-label {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.3;
        }

        /* Cores dos labels (mantidas) */
        .label-orange { color: #c45c26; }
        .label-black { color: #000; }
        .label-green { color: #2d5016; }
        .label-red { color: #c41e3a; }
        .label-blue { color: #1a3a5c; }
        .label-purple { color: #4a2d6b; }

        /* === FOOTER === */
        .window-footer {
            text-align: center;
            padding: 10px;
            font-size: 10px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 2px;
            background: #000;
            border-top: 2px solid #808080;
        }

        /* === MOLDURA TV === */
        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('pngs/tvframe.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            pointer-events: none;
            z-index: 10;
        }

        /* === SCANLINES === */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0) 3px,
                rgba(0,0,0,0.15) 3px,
                rgba(0,0,0,0.15) 4px
            );
            pointer-events: none;
            z-index: 20;
        }

        /* === RESPONSIVO === */
        @media (max-width: 768px) {
            #tv-screen { padding: 10% 12% 12% 12%; }
            .icon-grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 15px;
            }
            .icon-img { width: 48px; height: 48px; }
            .icon-label { font-size: 10px; }
        }
    </style>
</head>
<body>
    <div id="tv-container">
        <div id="tv-static"></div>

        <div id="tv-screen">
            <div class="retro-window">
                <!-- BARRA DE TÍTULO (sem ícone) -->
                <div class="window-titlebar">
                    <div class="window-title">PORTFOLIO</div>
                </div>

                <div class="window-content">
                    <div class="icon-grid">
                        <!-- 6 ícones distribuídos em 3 colunas -->
                        <div class="icon-item active" data-target="sobre">
                            <img class="icon-img" src="icons/sobre.png" alt="SOBRE" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect width=%2264%22 height=%2264%22 fill=%22%23c0c0c0%22 stroke=%22%23000%22 stroke-width=%222%22/><text x=%2232%22 y=%2238%22 text-anchor=%22middle%22 font-size=%2224%22 fill=%22%23000%22>?</text></svg>'" />
                            <span class="icon-label label-orange">SOBRE</span>
                        </div>

                        <div class="icon-item" data-target="projetos">
                            <img class="icon-img" src="icons/projetos.png" alt="PROJETOS" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect width=%2264%22 height=%2264%22 fill=%22%23c0c0c0%22 stroke=%22%23000%22 stroke-width=%222%22/><text x=%2232%22 y=%2238%22 text-anchor=%22middle%22 font-size=%2224%22 fill=%22%23000%22>📁</text></svg>'" />
                            <span class="icon-label label-black">PROJETOS</span>
                        </div>

                        <div class="icon-item" data-target="contato">
                            <img class="icon-img" src="icons/contato.png" alt="CONTATO" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect width=%2264%22 height=%2264%22 fill=%22%23c0c0c0%22 stroke=%22%23000%22 stroke-width=%222%22/><text x=%2232%22 y=%2238%22 text-anchor=%22middle%22 font-size=%2224%22 fill=%22%23000%22>@</text></svg>'" />
                            <span class="icon-label label-green">CONTATO</span>
                        </div>

                        <div class="icon-item" data-target="github">
                            <img class="icon-img" src="icons/github.png" alt="GITHUB" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect width=%2264%22 height=%2264%22 fill=%22%23c0c0c0%22 stroke=%22%23000%22 stroke-width=%222%22/><text x=%2232%22 y=%2238%22 text-anchor=%22middle%22 font-size=%2224%22 fill=%22%23000%22>&lt;/&gt;</text></svg>'" />
                            <span class="icon-label label-red">GITHUB</span>
                        </div>

                        <div class="icon-item" data-target="linkedin">
                            <img class="icon-img" src="icons/linkedin.png" alt="LINKEDIN" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect width=%2264%22 height=%2264%22 fill=%22%23c0c0c0%22 stroke=%22%23000%22 stroke-width=%222%22/><text x=%2232%22 y=%2238%22 text-anchor=%22middle%22 font-size=%2224%22 fill=%22%23000%22>in</text></svg>'" />
                            <span class="icon-label label-blue">LINKEDIN</span>
                        </div>

                        <div class="icon-item" data-target="email">
                            <img class="icon-img" src="icons/email.png" alt="EMAIL" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect width=%2264%22 height=%2264%22 fill=%22%23c0c0c0%22 stroke=%22%23000%22 stroke-width=%222%22/><text x=%2232%22 y=%2238%22 text-anchor=%22middle%22 font-size=%2224%22 fill=%22%23000%22>✉</text></svg>'" />
                            <span class="icon-label label-purple">EMAIL</span>
                        </div>
                    </div>
                </div>

                <div class="window-footer">
                    <span>© 2026 PORTFOLIO</span>
                </div>
            </div>
            <!-- REMOVIDO O #subinfo completamente -->
        </div>

        <div id="tv-frame"></div>
        <div id="scanlines"></div>
    </div>

    <script>
        (function() {
            const items = document.querySelectorAll('.icon-item');
            let current = 0;

            function updateMenu() {
                items.forEach((item, index) => {
                    item.classList.toggle('active', index === current);
                });
                // Não há mais #subinfo, então removemos a atualização
            }

            // Navegação por teclado (suporte a 3 colunas)
            document.addEventListener('keydown', function(e) {
                const cols = window.innerWidth <= 768 ? 2 : 3;
                const total = items.length;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    current = (current + cols) % total;
                    updateMenu();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    current = (current - cols + total) % total;
                    updateMenu();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    current = (current + 1) % total;
                    updateMenu();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    current = (current - 1 + total) % total;
                    updateMenu();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const target = items[current].getAttribute('data-target');
                    alert('Navegando para: ' + target);
                }
            });

            // Clique e duplo clique
            items.forEach((item, index) => {
                item.addEventListener('click', function() {
                    current = index;
                    updateMenu();
                });
                item.addEventListener('dblclick', function() {
                    const target = item.getAttribute('data-target');
                    alert('Navegando para: ' + target);
                });
            });

            updateMenu();
        })();
    </script>
</body>
</html>
